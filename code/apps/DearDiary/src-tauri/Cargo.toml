[package]
name = "deardiary"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deardiary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-o19-ffi = { path = "../../../packages/tauri-plugin-o19-ffi" }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
#serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
#base64 = "0.22.1"
#sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls"] }
#reqwest = { version = "0.12", features = ["json", "stream"] }
#scraper = "0.22"
#nom-exif = "2.4"
#image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
#blake3 = "1.5"
#uuid = { version = "1.10", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21" # Required to interact with Java environment
