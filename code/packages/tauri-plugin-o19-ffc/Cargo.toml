[package]
name = "tauri-plugin-o19-ffc"
description = "The Tauri bindings of the core of a foundational framework (o19) for Circulari.ty apps."
version = "0.1.0"
edition = "2024"
authors = ["Circulari.ty"]

links = "tauri-plugin-o19-ffc"

[dependencies]
tauri = { version = "2" }
o19-foundframecore = { path = "../foundframecore" }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
libcaesium = { version = "0.17", features = ["jpg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = "2"
